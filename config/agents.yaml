# 2 competitor + 2 monopolist profiles = satisfies Rule 4 role-balance exactly for a 4p game.
# For 3p test cases, drop one of these four (any one) to get the required 2:1 split.

- id: aggressive_monopolist
  role: monopolist
  cash_floor: 0                   # will spend down to zero to buy/build
  property_valuation_multiplier:
    default: 1.0
    high_price_groups: 1.3        # overvalues the expensive groups (Washington, SF, NY)
  trade_aggression: 0.8           # 0..1 — willingness to accept a lopsided trade to complete a group
  build_priority: immediate       # builds the instant monopolization + cash allow it

- id: conservative_competitor
  role: competitor
  cash_floor: 800
  property_valuation_multiplier:
    default: 1.0
    roi_weighted: true             # only buys properties above a computed ROI threshold
  trade_aggression: 0.2
  build_priority: slow

- id: balanced_monopolist
  role: monopolist
  cash_floor: 300
  property_valuation_multiplier:
    default: 1.0
  trade_aggression: 0.5
  build_priority: late_aggressive   # keeps a buffer early, builds hard once stable

- id: opportunistic_competitor
  role: competitor
  cash_floor: 100
  property_valuation_multiplier:
    default: 1.0
    cheap_groups: 1.4               # prioritizes cheap properties to build on fast
  trade_aggression: 0.6
  build_priority: immediate
